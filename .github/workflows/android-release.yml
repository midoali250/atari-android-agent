name: Signed Android release

on:
  workflow_dispatch:
    inputs:
      bundle_roms:
        description: 'Include ROMs from roms/ only if you have distribution rights'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-signed-release
  cancel-in-progress: false

jobs:
  signed-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install pinned SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Prepare temporary release keystore
        shell: bash
        env:
          ATARI_KEYSTORE_BASE64: ${{ secrets.ATARI_KEYSTORE_BASE64 }}
          ATARI_KEYSTORE_PASSWORD: ${{ secrets.ATARI_KEYSTORE_PASSWORD }}
          ATARI_KEY_ALIAS: ${{ secrets.ATARI_KEY_ALIAS }}
          ATARI_KEY_PASSWORD: ${{ secrets.ATARI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ATARI_KEYSTORE_BASE64:?Configure the ATARI_KEYSTORE_BASE64 repository secret}"
          : "${ATARI_KEYSTORE_PASSWORD:?Configure the ATARI_KEYSTORE_PASSWORD repository secret}"
          : "${ATARI_KEY_ALIAS:?Configure the ATARI_KEY_ALIAS repository secret}"
          : "${ATARI_KEY_PASSWORD:?Configure the ATARI_KEY_PASSWORD repository secret}"
          umask 077
          printf '%s' "$ATARI_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/atari-release.jks"
          printf 'ATARI_KEYSTORE_PATH=%s\n' "$RUNNER_TEMP/atari-release.jks" >> "$GITHUB_ENV"
      - name: Test, lint and export signed release APK
        env:
          ATARI_KEYSTORE_PASSWORD: ${{ secrets.ATARI_KEYSTORE_PASSWORD }}
          ATARI_KEY_ALIAS: ${{ secrets.ATARI_KEY_ALIAS }}
          ATARI_KEY_PASSWORD: ${{ secrets.ATARI_KEY_PASSWORD }}
        run: ./gradlew :core:test :android:testReleaseUnitTest :android:lintRelease :android:exportReleaseApk -PbundleRoms=${{ inputs.bundle_roms }} --no-daemon --stacktrace
      - name: Verify release APK
        run: |
          set -euo pipefail
          APK=artifacts/apk/atari-android-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -p 4 "$APK"
          sha256sum "$APK" > artifacts/apk/SHA256SUMS.txt
      - name: Upload signed release APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atari-android-release-apk
          path: |
            artifacts/apk/atari-android-release.apk
            artifacts/apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/atari-release.jks"
