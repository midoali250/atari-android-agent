name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install pinned SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test, lint and export debug APK
        run: ./gradlew :core:test :android:testDebugUnitTest :android:lintDebug :android:exportDebugApk --no-daemon --stacktrace
      - name: Verify APK signature, alignment and manifest
        run: |
          set -euo pipefail
          APK=artifacts/apk/atari-android-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -p 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -25
          sha256sum "$APK" > artifacts/apk/SHA256SUMS.txt
      - name: Upload installable debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atari-android-debug-apk
          path: |
            artifacts/apk/atari-android-debug.apk
            artifacts/apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-build-reports
          path: |
            android/build/reports/
            core/build/reports/
          if-no-files-found: ignore
          retention-days: 7
